name: Rust Linting
on:
  pull_request:
    branches:
      - mega
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup install stable && rustup component add clippy rustfmt

      - name: Run lint
        run: bash scripts/lint.sh
